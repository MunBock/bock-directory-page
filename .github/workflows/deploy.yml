name: Push index.html to S3 and Invalidate CloudFront

on:
  push:
    branches:
      - main
permissions:
  id-token: write
  contents: read

jobs:
  push-to-s3-and-invalidate-cloudfront:
    name: Push to S3 and Invalidate Cloudfront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Push index.html to S3
        run: aws s3 cp ./index.html s3://homunbock.com/index.html

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/"
